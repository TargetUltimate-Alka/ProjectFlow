version: '3.8'

services:
  # -------------------------------------------------------------
  # Infrastructure: Shared Database Instance (Isolated Databases)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: projectflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - projectflow-network

  # -------------------------------------------------------------
  # Infrastructure: Asynchronous Message Broker
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: projectflow-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Dashboard UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - projectflow-network

  # -------------------------------------------------------------
  # Microservices Layer
  # -------------------------------------------------------------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: projectflow-auth-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=projectflow_super_secret_jwt_key
      - JWT_EXPIRES_IN=1d
    depends_on:
      - mongodb
    networks:
      - projectflow-network

  project-service:
    build:
      context: ./services/project-service
      dockerfile: Dockerfile
    container_name: projectflow-project-service
    restart: always
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/project_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - projectflow-network

  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: projectflow-task-service
    restart: always
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/task_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - projectflow-network

  evaluation-service:
    build:
      context: ./services/evaluation-service
      dockerfile: Dockerfile
    container_name: projectflow-evaluation-service
    restart: always
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/evaluation_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - projectflow-network

  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile
    container_name: projectflow-integration-service
    restart: always
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/integration_db
      - GITHUB_TOKEN=
    depends_on:
      - mongodb
    networks:
      - projectflow-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: projectflow-notification-service
    restart: always
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGO_URI=mongodb://mongodb:27017/notification_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - projectflow-network

  # -------------------------------------------------------------
  # API Gateway (Reverse Proxy)
  # -------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: projectflow-gateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PROJECT_SERVICE_URL=http://project-service:5002
      - TASK_SERVICE_URL=http://task-service:5003
      - EVALUATION_SERVICE_URL=http://evaluation-service:5004
      - INTEGRATION_SERVICE_URL=http://integration-service:5005
      - NOTIFICATION_SERVICE_URL=http://notification-service:5006
    depends_on:
      - auth-service
      - project-service
      - task-service
      - evaluation-service
      - integration-service
      - notification-service
    networks:
      - projectflow-network

  # -------------------------------------------------------------
  # Frontend Application (React Client)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectflow-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - gateway
    networks:
      - projectflow-network

volumes:
  mongo_data:
    driver: local

networks:
  projectflow-network:
    driver: bridge
